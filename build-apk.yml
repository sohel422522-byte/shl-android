name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      abis:
        description: "CPU types (arm64-v8a fits almost every phone and gives the smallest APK; old 32-bit phones: arm64-v8a,armeabi-v7a)"
        default: "arm64-v8a"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain --stacktrace -Pabis="${{ github.event.inputs.abis || 'arm64-v8a' }}" 2>&1 | tee build.log
      - name: Show APK size
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          echo "APK size: $(du -h app/build/outputs/apk/debug/*.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: SHL-Downloader-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Put the errors on the summary page (copy and send them)
        if: failure()
        run: |
          {
            echo "## Build errors - copy this box and send it"
            echo '```'
            grep -n -E "^e: |error:|What went wrong|Execution failed|Could not |A problem occurred|Caused by|Unresolved|Duplicate|AAPT|Manifest merger|requires libraries" -A4 build.log | head -90
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
