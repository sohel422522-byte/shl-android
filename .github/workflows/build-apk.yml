name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      abis:
        description: "CPU types (arm64-v8a fits almost every phone and gives the smallest APK; old 32-bit phones: arm64-v8a,armeabi-v7a)"
        default: "arm64-v8a"
      ytdl:
        description: "yt-dlp engine library version (0.18.+ built successfully; if the build fails try 0.17.3)"
        default: "0.18.+"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and check the project files
        run: |
          if [ -f project.tar.gz ]; then tar xzf project.tar.gz; echo "Unpacked project.tar.gz"; fi
          if [ ! -f app/build.gradle.kts ] || [ ! -f app/src/main/AndroidManifest.xml ]; then
            {
              echo "## The 'app' folder is missing from the repository"
              echo "Upload the file project.tar.gz (easiest) or the whole app folder to the repository root, then run again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The app folder is missing. Upload project.tar.gz (or the whole app folder) to the repository root."
            exit 1
          fi
          echo "app files found: $(find app -type f | wc -l)"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Android SDK (do not rely on what the runner has)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          gradle assembleDebug --no-daemon --console=plain --stacktrace -Pabis="${{ github.event.inputs.abis || 'arm64-v8a' }}" -PytdlVersion="${{ github.event.inputs.ytdl || '0.18.+' }}" 2>&1 | tee build.log
      - name: Show APK size
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          echo "APK size: $(du -h app/build/outputs/apk/debug/*.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: SHL-Downloader-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Put the errors on the summary page (copy and send them)
        if: failure()
        run: |
          {
            echo "## Build errors - copy this box and send it"
            echo '```'
            grep -n -E "^e: |error:|What went wrong|Execution failed|Could not |A problem occurred|Caused by|Unresolved|Duplicate|AAPT|Manifest merger|requires libraries|SDK location|licen" -A4 build.log | head -70
            echo '```'
            echo "### Last lines of the log"
            echo '```'
            tail -n 40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
