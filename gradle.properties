org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# yt-dlp engine library version. If YouTube stops working, try 0.18.+ here.
ytdlVersion=0.17.+
# CPU types inside the APK. arm64-v8a = almost every phone made since 2017 (smallest APK).
# Very old 32-bit phones need: abis=arm64-v8a,armeabi-v7a  (about twice the size)
abis=arm64-v8a
